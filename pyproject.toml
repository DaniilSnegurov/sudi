[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "courtdocs"
version = "0.1.0"
description = "Конвейер обработки судебных документов: приказы, исполнительные листы, постановления ФССП"
requires-python = ">=3.11"
dependencies = [
    "defusedxml>=0.7",
    "openpyxl>=3.1",
    "pymupdf>=1.24",
    "numpy>=1.26",
    "rapidocr>=3.9",
    "onnxruntime>=1.20",
    "pymorphy3>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
courtdocs = "courtdocs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
courtdocs = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
